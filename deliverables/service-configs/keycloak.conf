# Keycloak Configuration for STIG Manager Deployment

# Database
db=mysql
db-url-host=localhost
db-url-database=keycloak
db-username=keycloak
db-password=Keycloak_DB_2026!

# Hostname (v2 format) - frontend URL as seen by browsers through Caddy
hostname=https://YOUR_SERVER_IP
hostname-backchannel-dynamic=true

# HTTP (Caddy terminates TLS)
http-enabled=true
http-port=8080
proxy-headers=xforwarded

# No relative path - Keycloak serves on root
# http-relative-path=/auth
